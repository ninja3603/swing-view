<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080D1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SWING QUANT 4.1</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px 12px 28px;
    background: #080D1A; color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.35;
  }
  .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: #111A2E; border: 1.5px solid #223150;
    border-radius: 20px; padding: 18px 16px; position: relative;
  }
  .status-box {
    max-width: 420px; margin: 28vh auto 0; text-align: center;
    background: #111A2E; border: 1.5px solid #223150; border-radius: 20px; padding: 28px 20px;
  }
  .status-title { font-size: 19px; font-weight: 800; color: #38BDF8; margin-bottom: 8px; }
  .status-desc { font-size: 15px; color: #94A3B8; }

  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .brand { font-size: 19px; font-weight: 800; color: #38BDF8; letter-spacing: -0.3px; }
  .ts { font-size: 15px; color: #94A3B8; margin-top: 3px; }
  .traffic-pill {
    display: flex; align-items: center; gap: 8px;
    background: #0C1324; border: 1.5px solid #223250;
    border-radius: 999px; padding: 8px 14px; flex-shrink: 0;
  }
  .lamp { width: 14px; height: 14px; border-radius: 50%; background: #2C3952; }
  .lamp.on-0 { background: #EF4444; box-shadow: 0 0 12px 3px rgba(239,68,68,0.75); }
  .lamp.on-1 { background: #FBBF24; box-shadow: 0 0 12px 3px rgba(251,191,36,0.75); }
  .lamp.on-2 { background: #10B981; box-shadow: 0 0 12px 3px rgba(16,185,129,0.75); }
  .lamp-word { font-size: 20px; font-weight: 800; margin-left: 4px; }

  .risk-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
  .risk-lbl { font-size: 15px; color: #94A3B8; }
  .risk-val { font-size: 18px; font-weight: 800; }
  .gauge-track { height: 11px; background: #1E293B; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .gauge-fill { height: 100%; border-radius: 999px; }
  .warn-box {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid transparent;
    font-size: 16px; font-weight: 700; display: flex; align-items: flex-start; gap: 8px;
  }
  .bolt { font-size: 18px; line-height: 1.2; }

  .glow-buy {
    background: radial-gradient(circle at 20% 0%, rgba(244,63,94,0.34), transparent 62%), #18121E;
    border: 2px solid #FB7185;
    box-shadow: 0 0 22px rgba(244,63,94,0.38), inset 0 1px 0 rgba(251,113,133,0.65);
  }
  .glow-standby {
    background: radial-gradient(circle at 20% 0%, rgba(56,189,248,0.24), transparent 62%), #101B2E;
    border: 2px solid #38BDF8;
    box-shadow: 0 0 20px rgba(56,189,248,0.30), inset 0 1px 0 rgba(125,211,252,0.55);
  }
  .sig-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sig-title-wrap { display: flex; align-items: center; gap: 9px; }
  .led { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .led-buy { background: #FB7185; box-shadow: 0 0 12px 3px rgba(251,113,133,0.85); }
  .led-standby { background: #38BDF8; box-shadow: 0 0 12px 3px rgba(56,189,248,0.85); }
  .sig-head-txt { font-size: 17px; font-weight: 800; letter-spacing: 0.3px; }
  .buy-txt { color: #FB7185; }
  .standby-txt { color: #7DD3FC; }
  .badge { font-size: 14px; font-weight: 800; padding: 5px 12px; border-radius: 9px; }
  .badge-buy { background: #6E2434; color: #FFE4E6; border: 1.5px solid #FB7185; }
  .badge-standby { background: #12304D; color: #BAE6FD; border: 1.5px solid #38BDF8; }
  .badge-count { background: #1E293B; color: #FBBF24; border: 1px solid #475569; font-size: 13px; padding: 4px 10px; border-radius: 999px; font-weight: 800; }

  .standby-main { font-size: 24px; font-weight: 800; color: #F8FAFC; margin-top: 4px; }
  .standby-sub { font-size: 15px; color: #94A3B8; margin-top: 6px; }

  .sig-stock-row { display: flex; align-items: baseline; gap: 8px; }
  .sig-name { font-size: 28px; font-weight: 800; }
  .sig-code { font-size: 16px; color: #94A3B8; }
  .sig-price-row { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 14px; }
  .sig-price { font-size: 27px; font-weight: 800; }
  .sig-chg { font-size: 21px; font-weight: 800; }
  .sig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sig-metric {
    background: rgba(12,19,36,0.92); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 11px 6px; text-align: center;
  }
  .m-lbl { font-size: 13px; color: #94A3B8; }
  .m-val { font-size: 18px; font-weight: 800; margin-top: 5px; }
  .sig-divider { height: 1px; background: rgba(255,255,255,0.14); margin: 16px 0; }

  /* 1차 정량 통과 카드 */
  .s1-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .s1-list { display: flex; flex-direction: column; gap: 10px; }
  .s1-item {
    background: #16223B; border: 1px solid #26385E;
    border-radius: 14px; padding: 14px;
  }
  .s1-row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .s1-name { font-size: 20px; font-weight: 800; color: #F8FAFC; }
  .s1-sec { font-size: 14px; color: #94A3B8; flex-shrink: 0; }
  .s1-row2 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .s1-price { font-size: 19px; font-weight: 800; }
  .s1-chg { font-size: 16px; font-weight: 800; margin-left: 4px; }
  .s1-rs { font-size: 15px; font-weight: 800; color: #38BDF8; }
  .s1-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .s1-tag {
    background: #0C1324; border: 1px solid #223250; color: #CBD5E1;
    font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 8px;
  }
  .s1-status {
    margin-top: 10px; padding: 7px 10px; border-radius: 9px;
    font-size: 13.5px; font-weight: 800; display: inline-block;
  }
  .s1-status.pass { background: #0E2925; color: #6EE7B7; border: 1px solid #1F5E52; }
  .s1-status.block { background: #2A151B; color: #FCA5A5; border: 1px solid #6E2330; }

  .mb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-title { font-size: 19px; font-weight: 800; color: #F8FAFC; }
  .fut-txt { font-size: 15px; font-weight: 800; }
  .idx-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .idx-row:last-of-type { border-bottom: none; }
  .idx-lbl { font-size: 18px; font-weight: 700; color: #94A3B8; }
  .idx-right { display: flex; align-items: baseline; gap: 14px; }
  .idx-val { font-size: 21px; font-weight: 800; color: #F8FAFC; }
  .idx-chg { font-size: 19px; font-weight: 800; min-width: 84px; text-align: right; }

  .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .macro-cell {
    background: #0C1324; border: 1px solid #1C2A45; border-radius: 12px;
    padding: 11px 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .mc-lbl { font-size: 14px; color: #94A3B8; }
  .mc-val { font-size: 17px; font-weight: 800; color: #F8FAFC; }

  .w-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .w-item { background: #16223B; border-radius: 14px; padding: 14px; }
  .w-row1 { display: flex; justify-content: space-between; align-items: center; }
  .w-left { display: flex; align-items: center; gap: 8px; }
  .rank-pill { background: #1B3459; color: #38BDF8; font-size: 14px; font-weight: 800; padding: 3px 9px; border-radius: 8px; }
  .w-name { font-size: 20px; font-weight: 800; }
  .w-sec { font-size: 14px; color: #94A3B8; }
  .w-row2 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; }
  .w-price { font-size: 20px; font-weight: 800; }
  .w-chg { font-size: 17px; font-weight: 800; margin-left: 4px; }
  .w-sup { font-size: 16px; font-weight: 800; color: #38BDF8; }
  .w-row3 { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .w-brk { font-size: 14px; color: #94A3B8; white-space: nowrap; }
  .bar-track { flex: 1; height: 9px; background: #1E293B; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: #38BDF8; border-radius: 999px; }

  .dart-strip {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: #0C1324; color: #CBD5E1; font-size: 15px;
  }
  .hl-list { margin: 12px 0 0; padding-left: 18px; color: #CBD5E1; font-size: 16px; display: flex; flex-direction: column; gap: 10px; }
  .hold-row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 17px; }
  .hold-row:last-child { border-bottom: none; }
  .hold-sub { font-size: 15px; color: #94A3B8; margin-top: 4px; }

  .up { color: #F43F5E; }
  .down { color: #3B82F6; }
  .flat { color: #94A3B8; }
  .green { color: #34D399; }
  .coral { color: #FB7185; }
  .cyan { color: #38BDF8; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 6px; color: #64748B; font-size: 13px;
  }
  .refresh-btn {
    background: #16223B; color: #7DD3FC; border: 1px solid #223150;
    border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
<div id="root">
  <div class="status-box">
    <div class="status-title">SWING QUANT 4.1</div>
    <div class="status-desc">최신 시장 데이터를 불러오는 중...</div>
  </div>
</div>

<script>
const root = document.getElementById("root");

function esc(val) {
  const d = document.createElement("div");
  d.textContent = (val === null || val === undefined) ? "" : String(val);
  return d.innerHTML;
}

function fmtNum(n, dec) {
  return Number(n || 0).toLocaleString("ko-KR", {
    minimumFractionDigits: dec,
    maximumFractionDigits: dec
  });
}

function fmtChg(n, dec = 2) {
  const v = Number(n || 0);
  return (v > 0 ? "+" : "") + v.toFixed(dec) + "%";
}

function chgCls(n) {
  const v = Number(n || 0);
  return v > 0 ? "up" : (v < 0 ? "down" : "flat");
}

function showMsg(title, desc) {
  root.innerHTML = `<div class="status-box">
    <div class="status-title">${esc(title)}</div>
    <div class="status-desc">${esc(desc)}</div>
  </div>`;
}

function getTargetUrl() {
  const fromHash = location.hash ? decodeURIComponent(location.hash.slice(1)).trim() : "";
  const fromParam = (new URLSearchParams(location.search).get("u") || "").trim();
  const candidate = fromHash || fromParam;
  if (candidate.startsWith("https://script.google.com/macros/s/")) {
    try { localStorage.setItem("swing_dash_url", candidate); } catch (e) {}
    return candidate;
  }
  try {
    const saved = localStorage.getItem("swing_dash_url") || "";
    if (saved.startsWith("https://script.google.com/macros/s/")) return saved;
  } catch (e) {}
  return "";
}

function renderDashboard(st) {
  const mode = st.mode || "close";
  const verLabel = (st.version || "Ver 4.1").replace(/^Ver\s*/i, "");
  const m = st.macro || {};
  const riskPct = Number(m.risk_pct || 0);
  const maxRiskPct = 2.5;

  const buySignals = Array.isArray(st.buy_signals) ? st.buy_signals : [];
  const stage1Passed = Array.isArray(st.stage1_passed) ? st.stage1_passed : [];
  const watchTop3 = Array.isArray(st.watch_top3) ? st.watch_top3 : [];
  const headlines = Array.isArray(st.headlines) ? st.headlines : [];
  const holdReports = Array.isArray(st.hold_reports) ? st.hold_reports : [];

  let activeIdx = 0, stWord = "방어", stSub = "전면 차단", stColor = "#EF4444", gaugePct = 5;
  let warnBg = "#2A151B", warnBd = "#6E2330", warnTxt = "#FCA5A5";
  if (riskPct >= maxRiskPct - 0.05) {
    activeIdx = 2; stWord = "정상"; stSub = "정상 가동"; stColor = "#10B981"; gaugePct = 100;
    warnBg = "#0E2925"; warnBd = "#1F5E52"; warnTxt = "#6EE7B7";
  } else if (riskPct > 0) {
    activeIdx = 1; stWord = "주의"; stSub = "축소 가동"; stColor = "#F59E0B"; gaugePct = 50;
    warnBg = "#262015"; warnBd = "#5C4720"; warnTxt = "#FBBF24";
  }

  // 1) SIGNAL 영역 (마감 모드)
  let signalHtml = "";
  if (mode === "close") {
    if (buySignals.length > 0) {
      const itemsHtml = buySignals.map(s => `
        <div class="sig-item">
          <div class="sig-stock-row">
            <span class="sig-name">${esc(s.name)}</span>
            <span class="sig-code">${esc(s.sector || s.ticker || "")}</span>
          </div>
          <div class="sig-price-row">
            <span class="sig-price">${fmtNum(s.price, 0)}원</span>
            <span class="sig-chg ${chgCls(s.chg)}">${fmtChg(s.chg)}</span>
          </div>
          <div class="sig-grid">
            <div class="sig-metric">
              <div class="m-lbl">권장 비중</div>
              <div class="m-val green">${Number(s.weight || 0).toFixed(1)}%</div>
            </div>
            <div class="sig-metric">
              <div class="m-lbl">손절선</div>
              <div class="m-val coral">${fmtNum(s.stop, 0)}원</div>
            </div>
            <div class="sig-metric">
              <div class="m-lbl">RS 점수</div>
              <div class="m-val cyan">${Number(s.supply_score || 0).toFixed(0)}점</div>
            </div>
          </div>
        </div>`).join('<div class="sig-divider"></div>');

      signalHtml = `
        <section class="card glow-buy">
          <div class="sig-head">
            <div class="sig-title-wrap"><span class="led led-buy"></span><span class="sig-head-txt buy-txt">BUY SIGNAL</span></div>
            <span class="badge badge-buy">T·RS·A·C PASS</span>
          </div>
          ${itemsHtml}
        </section>`;
    } else {
      const standbyReason = riskPct <= 0
        ? "매크로 방어 모드 가동 · 신규 매수 전면 차단"
        : "조건 T·RS·A·C 동시 충족 없음 · 기존 포지션 래칫 유지";
      signalHtml = `
        <section class="card glow-standby">
          <div class="sig-head">
            <div class="sig-title-wrap"><span class="led led-standby"></span><span class="sig-head-txt standby-txt">SIGNAL MONITOR</span></div>
            <span class="badge badge-standby">STANDBY</span>
          </div>
          <div class="standby-main">신규 매수 시그널 없음</div>
          <div class="standby-sub">${esc(standbyReason)}</div>
        </section>`;
    }
  }

  // 2) 1차 정량 통과 후보 카드 (T + RS + A + C 통과 종목 상세)
  let stage1Html = "";
  if (mode === "close" && stage1Passed.length > 0) {
    const s1Items = stage1Passed.map(s => {
      const isPass = String(s.status || "").includes("최종 매수 통과");
      const statusCls = isPass ? "pass" : "block";
      const statusTxt = isPass ? "최종 매수 통과" : `2차 차단: ${s.status}`;
      return `
        <div class="s1-item">
          <div class="s1-row1">
            <span class="s1-name">${esc(s.name)}</span>
            <span class="s1-sec">${esc(s.sector || "")}</span>
          </div>
          <div class="s1-row2">
            <div><span class="s1-price">${fmtNum(s.price, 0)}원</span> <span class="s1-chg ${chgCls(s.chg)}">${fmtChg(s.chg)}</span></div>
            <span class="s1-rs">RS ${Number(s.rs || 0).toFixed(0)}점</span>
          </div>
          <div class="s1-tags">
            <span class="s1-tag">60일선>120일선(T)</span>
            <span class="s1-tag">60일 ${fmtChg(s.ret60, 1)}(RS)</span>
            <span class="s1-tag">주황신호(A)</span>
            <span class="s1-tag">거래대금 ${Number(s.turnover_ratio || 0).toFixed(2)}배(C)</span>
          </div>
          <div class="s1-status ${statusCls}">${esc(statusTxt)}</div>
        </div>`;
    }).join("");

    stage1Html = `
      <section class="card">
        <div class="s1-head">
          <div class="card-title">1차 정량 통과 (T·RS·A·C)</div>
          <span class="badge-count">${stage1Passed.length}건</span>
        </div>
        <div class="s1-list">${s1Items}</div>
      </section>`;
  }

  // 3) 하단 섹션 (마감: 관심 TOP 3 / 모닝: 헤드라인 + DART)
  let bottomHtml = "";
  if (mode === "close" && watchTop3.length > 0) {
    const wItems = watchTop3.slice(0, 3).map((w, idx) => {
      const rs = Number(w.supply_score || 0);
      const ret60 = Number(w.breakout || 0);
      const barW = Math.max(8, Math.min(100, Math.round(rs)));
      return `
        <div class="w-item">
          <div class="w-row1">
            <div class="w-left"><span class="rank-pill">#${idx + 1}</span><span class="w-name">${esc(w.name)}</span></div>
            <span class="w-sec">${esc(w.sector)}</span>
          </div>
          <div class="w-row2">
            <div><span class="w-price">${fmtNum(w.price, 0)}원</span> <span class="w-chg ${chgCls(w.chg)}">${fmtChg(w.chg)}</span></div>
            <span class="w-sup">RS ${rs.toFixed(0)}점</span>
          </div>
          <div class="w-row3">
            <span class="w-brk">60일 수익 ${fmtChg(ret60, 1)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${barW}%"></div></div>
          </div>
        </div>`;
    }).join("");

    bottomHtml = `
      <section class="card">
        <div class="card-title">차기 돌파 대기열 (TOP 3)</div>
        <div class="w-list">${wItems}</div>
      </section>`;
  } else if (mode !== "close") {
    const hlItems = (headlines.length ? headlines : ["수신된 주요 경제 헤드라인 없음"])
      .slice(0, 3)
      .map(h => `<li>${esc(h)}</li>`).join("");
    const dartLine = st.dart_summary
      ? `<div class="dart-strip">보유종목 DART 악재 <b>${st.dart_summary.fatal}건</b> · 어닝 임박 <b>${st.dart_summary.earn}건</b></div>`
      : "";
    bottomHtml = `
      <section class="card">
        <div class="card-title">주요 경제 헤드라인</div>
        ${dartLine}
        <ul class="hl-list">${hlItems}</ul>
      </section>`;
  }

  let holdHtml = "";
  if (holdReports.length > 0) {
    const hRows = holdReports.map(h => `
      <div class="hold-row">
        <div><b>${esc(h.name)}</b> <span class="${chgCls(h.pnl_pct)}">${fmtChg(h.pnl_pct)}</span></div>
        <div class="hold-sub">현재 ${fmtNum(h.curr_close, 0)}원 · 손절선 <span class="coral">${fmtNum(h.stop_price, 0)}원</span></div>
      </div>`).join("");
    holdHtml = `<section class="card"><div class="card-title">보유 종목 래칫 추적</div>${hRows}</section>`;
  }

  const futSum = Number(m.es_chg || 0) + Number(m.nq_chg || 0);
  const futCls = futSum >= 0 ? "up" : "down";
  const modeLabel = mode === "close" ? "마감" : "모닝";

  root.innerHTML = `<div class="wrap">
    <section class="card">
      <div class="top-row">
        <div>
          <div class="brand">SWING QUANT ${esc(verLabel)}</div>
          <div class="ts">${esc(st.timestamp_str || "")} · ${modeLabel}</div>
        </div>
        <div class="traffic-pill">
          <span class="lamp ${activeIdx === 0 ? "on-0" : ""}"></span>
          <span class="lamp ${activeIdx === 1 ? "on-1" : ""}"></span>
          <span class="lamp ${activeIdx === 2 ? "on-2" : ""}"></span>
          <span class="lamp-word" style="color:${stColor}">${stWord}</span>
        </div>
      </div>
      <div class="risk-row">
        <span class="risk-lbl">리스크 허용 (${stSub})</span>
        <span class="risk-val" style="color:${stColor}">${riskPct.toFixed(2)}% / ${maxRiskPct.toFixed(1)}%</span>
      </div>
      <div class="gauge-track"><div class="gauge-fill" style="width:${gaugePct}%;background:${stColor};box-shadow:0 0 12px ${stColor};"></div></div>
      <div class="warn-box" style="background:${warnBg};border-color:${warnBd};color:${warnTxt};">
        <span class="bolt" style="color:${stColor}">⚡</span>
        <span>${esc(m.warning_reason || "특이 경계 요인 없음")}</span>
      </div>
    </section>

    ${signalHtml}
    ${stage1Html}

    <section class="card">
      <div class="mb-head">
        <div class="card-title">MARKET BOARD</div>
        <div class="fut-txt ${futCls}">ES ${fmtChg(m.es_chg)} | NQ ${fmtChg(m.nq_chg)}</div>
      </div>
      <div class="idx-row">
        <span class="idx-lbl">KOSPI</span>
        <div class="idx-right"><span class="idx-val">${fmtNum(m.kospi, 2)}</span><span class="idx-chg ${chgCls(m.kospi_chg)}">${fmtChg(m.kospi_chg)}</span></div>
      </div>
      <div class="idx-row">
        <span class="idx-lbl">KOSDAQ</span>
        <div class="idx-right"><span class="idx-val">${fmtNum(m.kosdaq, 2)}</span><span class="idx-chg ${chgCls(m.kosdaq_chg)}">${fmtChg(m.kosdaq_chg)}</span></div>
      </div>
      <div class="idx-row">
        <span class="idx-lbl">S&P500</span>
        <div class="idx-right"><span class="idx-val">${fmtNum(m.sp500, 1)}</span><span class="idx-chg ${chgCls(m.sp500_chg)}">${fmtChg(m.sp500_chg)}</span></div>
      </div>
      <div class="idx-row">
        <span class="idx-lbl">나스닥</span>
        <div class="idx-right"><span class="idx-val">${fmtNum(m.nasdaq, 1)}</span><span class="idx-chg ${chgCls(m.nasdaq_chg)}">${fmtChg(m.nasdaq_chg)}</span></div>
      </div>
      <div class="macro-grid">
        <div class="macro-cell"><span class="mc-lbl">원/달러</span><span class="mc-val">${fmtNum(m.usdkrw, 1)}원</span></div>
        <div class="macro-cell"><span class="mc-lbl">미10년</span><span class="mc-val">${Number(m.us10y || 0).toFixed(2)}%</span></div>
        <div class="macro-cell"><span class="mc-lbl">WTI유가</span><span class="mc-val">$${Number(m.wti || 0).toFixed(1)}</span></div>
        <div class="macro-cell"><span class="mc-lbl">KRX금</span><span class="mc-val">${fmtNum(m.krx_gold, 0)}원</span></div>
      </div>
    </section>

    ${holdHtml}
    ${bottomHtml}

    <div class="footer">
      <span>SWING QUANT BOT VER ${esc(verLabel)}</span>
      <button class="refresh-btn" onclick="loadDashboard()">새로고침</button>
    </div>
  </div>`;
}

async function loadDashboard() {
  const base = getTargetUrl();
  if (!base) {
    showMsg("연결 주소 필요", "ntfy 알림의 대시보드 링크를 통해 접속해 주세요.");
    return;
  }
  const sep = base.includes("?") ? "&" : "?";
  const apiUrl = `${base}${sep}format=json&_t=${Date.now()}`;
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data.ok || !data.state) throw new Error(data.error || "데이터 형식 오류");
    renderDashboard(data.state);
  } catch (err) {
    showMsg("데이터 불러오기 실패", "Apps Script 새 버전 배포 여부를 확인해 주세요. (" + err.message + ")");
  }
}

loadDashboard();
</script>
